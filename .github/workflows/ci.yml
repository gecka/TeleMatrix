# Trunk CI. `main` is the sole release lineage — every tag is cut from it, betas
# included (see release.yml). Other branches are short-lived and reach main by merge.
#
#   push, any branch -> tests only (Linux). Cheap early signal while iterating.
#   push to main     -> tests + the full 3-OS package build, unsigned. Every commit
#                       that can be tagged is therefore packaged before it is,
#                       so packaging breaks surface on a free run, never mid-release.
#   pull_request     -> tests only. Package builds are not a PR gate.
#   dispatch         -> tests + package build, on any branch you pick.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pushes/PR updates are cancelled. Note a branch with an open PR still
  # runs twice — `push` and `pull_request` carry different refs, so this group
  # cannot dedupe them. Branch pushes are Linux-only, so that is left alone.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_reusable-tests.yml

  build:
    name: Build packages
    # main and explicit dispatches only. Not dev: it takes commits all day and
    # three OS builds per push is ~90 minutes of runner time for no new signal.
    # A PR's ref is refs/pull/N/merge, so this excludes pull_request too.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
    needs: tests   # gate the package build on green tests
    uses: ./.github/workflows/_reusable-build.yml
    with:
      publish: false   # unsigned; no GitHub Release
