# Trunk CI. `main` is the sole release lineage — every tag is cut from it, betas
# included (see release.yml). Other branches are short-lived and reach main by merge.
#
#   push, any branch -> tests only (Linux). Cheap early signal while iterating.
#   pull_request     -> tests only. Package builds are not a PR gate.
#   dispatch         -> tests + the full 3-OS package build, unsigned, on any
#                       branch you pick. Run it before tagging to prove packaging
#                       still works without spending a release on it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pushes/PR updates are cancelled. Note a branch with an open PR still
  # runs twice — `push` and `pull_request` carry different refs, so this group
  # cannot dedupe them. Branch pushes are Linux-only, so that is left alone.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_reusable-tests.yml

  build:
    name: Build packages
    # Explicit dispatches only. Three OS builds are ~90 minutes of runner time,
    # and on a push nobody is waiting for the result — ask for it when it matters.
    if: github.event_name == 'workflow_dispatch'
    needs: tests   # gate the package build on green tests
    uses: ./.github/workflows/_reusable-build.yml
    with:
      publish: false   # unsigned; no GitHub Release
