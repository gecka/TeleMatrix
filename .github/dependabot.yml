# Automated dependency PRs. Grouped and capped so this stays a weekly review, not a
# firehose — every PR runs the full CI (tests + 3-OS build) via ci.yml.
version: 2

updates:
  # Pinned action versions in the workflows (checkout, install-qt, rust-toolchain, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      # This action's "version" is the pinned rustc, not an action API version, so
      # dependabot bumps it to toolchains that need not exist yet (1.100.0 404'd on
      # rustup and took the whole actions group red). Move it by hand, in step with
      # rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
    open-pull-requests-limit: 5

  # The protocol/crypto staticlib. matrix-sdk bumps regularly move the rustc MSRV —
  # if a PR fails to build, check the toolchain pin (rust-toolchain.toml + the
  # dtolnay/rust-toolchain refs in the workflows) before touching the code.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      matrix-sdk:
        patterns: ['matrix-sdk*']
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # sha2 0.11 moved to digest 0.11 / crypto-common 0.2 while hkdf 0.12 is still on
      # digest 0.10, so Hkdf::<Sha256> stops typechecking against both generations in
      # one graph. Drop this once hkdf ships a digest-0.11 release.
      - dependency-name: sha2
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /rust/cbindgen_runner
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
