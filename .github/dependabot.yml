# Automated dependency PRs. Grouped and capped so this stays a weekly review, not a
# firehose.
#
# A green check on one of these means the Linux TESTS passed — ci.yml does not run
# the package build on pull requests. macOS and Windows packaging is only exercised
# once the bump reaches main or dev, so a bump that breaks a platform build fails
# after the merge, not before it.
version: 2

updates:
  # Pinned action versions in the workflows (checkout, install-qt, rust-toolchain, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      # This action's "version" is the pinned rustc, not an action API version, so
      # dependabot bumps it to toolchains that need not exist yet (1.100.0 404'd on
      # rustup and took the whole actions group red). Move it by hand, in step with
      # rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
    open-pull-requests-limit: 5

  # The protocol/crypto staticlib. matrix-sdk bumps regularly move the rustc MSRV —
  # if a PR fails to build, check the toolchain pin (rust-toolchain.toml + the
  # dtolnay/rust-toolchain refs in the workflows) before touching the code.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      matrix-sdk:
        patterns: ['matrix-sdk*']
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # RustCrypto generation lock. aes/ctr/cipher/hkdf/sha2 are pinned to the versions
      # matrix-sdk-crypto and vodozemac already pull, so the artifact carries one copy of
      # each. Their next 0.x steps (aes 0.9, ctr 0.10, hkdf 0.13, sha2 0.11) are the
      # digest-0.11 / cipher-0.5 move, which does not typecheck against a graph still on
      # digest 0.10 — Hkdf::<Sha256> and Ctr128BE<Aes256> both break. Lift this when
      # matrix-sdk moves, not before. Patch bumps still come through.
      #
      # semver-minor, not -major: dependabot compares version segments literally, so
      # 0.12 -> 0.13 is a *minor*. An ignore listing only major never fires.
      - dependency-name: aes
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: ctr
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: cipher
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: hkdf
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: sha2
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # FFmpeg generation lock. ffmpeg-next's major tracks FFmpeg's, and macOS links
      # the universal FFmpeg 7.1 that Qt ships — the crate pin, the vendored headers
      # in third_party/ffmpeg-7.1, Qt's sonames (asserted in CMakeLists.txt) and the
      # vcpkg commit the Windows job checks out are one unit. Moving the crate alone
      # is the mismatch that already killed the Windows build once: ffmpeg-sys-next
      # 7.x includes libavcodec/avfft.h, which FFmpeg 8 removed. PR CI cannot catch
      # it — no package build runs on pull requests (see the header above). Re-pin by
      # hand, all four together; third_party/ffmpeg-7.1/README.md has the procedure.
      - dependency-name: ffmpeg-next
        update-types: ['version-update:semver-major']
      - dependency-name: ffmpeg-sys-next
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /rust/cbindgen_runner
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
